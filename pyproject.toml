[project]
name = "stcg-cikm"
version = "0.1.0"
description = "Preparation scaffold for self-supervised temporal-causal graph structure discovery."
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "pandas>=2.0",
    "matplotlib>=3.7",
    "pyyaml>=6.0",
    "torch>=2.1",
    "tqdm>=4.66",
    "tigramite>=5.2.10",
]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider"
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
